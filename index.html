<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E2EE Messenger</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <header class="app-header">
      <div class="lock-icon">🔒</div>
      <div>
        <h1>E2EE Messenger</h1>
        <p class="subtitle">Ende-zu-Ende-verschlüsselt · AES-256-GCM</p>
      </div>
      <span id="status-dot" class="status-dot" title="Verbindungsstatus"></span>
    </header>

    <div id="login-screen" class="login-screen">
      <div class="login-card">
        <h2>Chat betreten</h2>
        <p class="hint">Der Server sieht nur verschlüsselte Daten. Zum Lesen der Nachrichten
           wird intern das vereinbarte gemeinsame Passwort verwendet.</p>
        <label for="username-input">Dein Anzeigename</label>
        <input id="username-input" type="text" placeholder="z. B. Alice" autocomplete="off">
        <button id="join-btn">Chat betreten</button>
      </div>
    </div>

    <main id="chat-screen" class="chat-screen hidden">
      <div id="messages" class="messages"></div>

      <form id="message-form" class="message-form">
        <input id="message-input" type="text" placeholder="Nachricht eingeben …" autocomplete="off">
        <button type="submit">Senden</button>
      </form>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
